[project]
name = "aivar-server"
version = "0.1.0"
description = "aivar FastAPI server"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.37.0",
    "pydantic-settings>=2.11.0",
    "playwright>=1.62.0",
    "psycopg[binary]>=3.3.5",
    # Required by FastAPI to parse multipart form data (the PRD upload).
    "python-multipart>=0.0.9",
]

[project.scripts]
# `uv run serve` -- the only correct way to start this in development.
#
# Plain `uvicorn app.main:app --reload` watches the whole server directory,
# which includes tests/generated and artifacts. A run writes its pytest files
# there, the watcher sees them, and the server restarts mid-run: the pipeline
# stops itself the moment it succeeds. app/main.py restricts the watcher to the
# source package, so going through this entry point cannot do that.
serve = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
