[project]
name = "aivar-server"
version = "0.1.0"
description = "aivar FastAPI server"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.37.0",
    "pydantic-settings>=2.11.0",
    "playwright>=1.62.0",
    "psycopg[binary]>=3.3.5",
    # Required by FastAPI to parse multipart form data (the PRD upload).
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
